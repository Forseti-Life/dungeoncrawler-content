name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        drupal-version: ['9.5', '10.0', '11.0']
        php-version: ['8.1', '8.2']

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drupal
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: gd, sqlite, mysql, pdo_mysql
        tools: composer:v2, drush
        coverage: pcov

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache composer dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install --no-progress --no-suggest

    - name: Run PHPCS
      run: vendor/bin/phpcs --standard=Drupal src/ tests/
      continue-on-error: true

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse src/
      continue-on-error: true

    - name: Run PHPUnit
      run: vendor/bin/phpunit
      continue-on-error: true

    - name: Install Drupal
      run: |
        composer require --dev drupal/core:${{ matrix.drupal-version }}.*
        drush site:install --db-url=mysql://root:root@127.0.0.1/drupal
        drush en amisafe

    - name: Run Drupal tests
      run: drush test:run
      continue-on-error: true

    - name: Generate coverage report
      run: vendor/bin/phpunit --coverage-clover=coverage.xml
      continue-on-error: true

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
      continue-on-error: true
