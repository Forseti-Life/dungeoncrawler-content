professional_website_content.install_content:
  path: '/admin/install-content'
  defaults:
    _controller: '\Drupal\professional_website_content\Controller\ContentInstallController::installContent'
    _title: 'Install Professional Content'
  requirements:
    _permission: 'administer site configuration'

professional_website_content.home:
  path: '/home'
  defaults:
    _controller: '\Drupal\professional_website_content\Controller\ProfessionalContentController::homePage'
    _title: 'Welcome to St. Louis Integration'
  requirements:
    _access: 'TRUE'
  methods: [GET, POST]

