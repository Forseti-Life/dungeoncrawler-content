# Job Hunter Routes
# Complete routing configuration for job hunter module
# Routes accessible to authenticated users

# Job Hunter Dashboard (Main Landing Page)
job_hunter.dashboard:
  path: '/jobhunter'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\JobApplicationController::dashboard'
    _title: 'Job Hunter Dashboard'
  requirements:
    _user_is_logged_in: 'TRUE'

# Job Hunter Home (alternate entry point)
job_hunter.home:
  path: '/jobhunter/home'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\JobHunterHomeController::home'
    _title: 'Job Hunter'
  requirements:
    _user_is_logged_in: 'TRUE'

# Queue Management Routes (Admin only)
job_hunter.queue_run:
  path: '/jobhunter/queue/run'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\JobHunterHomeController::runQueueAjax'
  methods: [POST]
  requirements:
    _permission: 'administer job application automation'

job_hunter.queue_run_all:
  path: '/jobhunter/queue/run-all'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\JobHunterHomeController::runAllQueuesAjax'
  methods: [POST]
  requirements:
    _permission: 'administer job application automation'

job_hunter.queue_status:
  path: '/jobhunter/queue/status'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\JobHunterHomeController::getQueueStatusAjax'
  methods: [GET]
  requirements:
    _permission: 'administer job application automation'

# Module Settings
job_hunter.settings:
  path: '/jobhunter/settings'
  defaults:
    _form: '\Drupal\job_hunter\Form\SettingsForm'
    _title: 'Job Application Automation Settings'
  requirements:
    _permission: 'administer job application automation'

# Documentation Home
job_hunter.documentation:
  path: '/jobhunter/documentation'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\DocumentationController::index'
    _title: 'Documentation'
  requirements:
    _permission: 'administer job application automation'

# Documentation - README
job_hunter.documentation.readme:
  path: '/jobhunter/documentation/readme'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\DocumentationController::viewDocument'
    _title: 'Documentation Home'
    file: 'README.md'
  requirements:
    _permission: 'administer job application automation'

# Documentation - Architecture
job_hunter.documentation.architecture:
  path: '/jobhunter/documentation/architecture'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\DocumentationController::viewDocument'
    _title: 'Architecture'
    file: 'ARCHITECTURE.md'
  requirements:
    _permission: 'administer job application automation'

# Documentation - Process Flow
job_hunter.documentation.process_flow:
  path: '/jobhunter/documentation/process-flow'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\DocumentationController::viewDocument'
    _title: 'Process Flows'
    file: 'PROCESS_FLOW.md'
  requirements:
    _permission: 'administer job application automation'

# Documentation - FAQ
job_hunter.documentation.faq:
  path: '/jobhunter/documentation/faq'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\DocumentationController::viewDocument'
    _title: 'FAQ'
    file: 'FAQ.md'
  requirements:
    _permission: 'administer job application automation'

# Job Seeker Profile Add
job_hunter.job_seeker_add:
  path: '/jobseeker/add'
  defaults:
    _form: '\Drupal\job_hunter\Form\JobSeekerForm'
    _title: 'Create Job Seeker Profile'
  requirements:
    _permission: 'administer job application automation'

# Job Seeker Profile Edit
job_hunter.job_seeker_edit:
  path: '/jobseeker/{job_seeker_id}/edit'
  defaults:
    _form: '\Drupal\job_hunter\Form\JobSeekerForm'
    _title: 'Edit Job Seeker Profile'
  requirements:
    _permission: 'administer job application automation'
    job_seeker_id: \d+

# Job Seeker Profile View
job_hunter.user_job_seeker_view:
  path: '/jobhunter/profile'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::viewJobSeekerProfile'
    _title: 'Job Seeker Profile'
  requirements:
    _permission: 'administer job application automation'

# Job Discovery - Company Selection Page
job_hunter.start_job_discovery:
  path: '/jobhunter/job-discovery/start'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::startJobDiscovery'
    _title: 'Job Discovery - Select Company'
  requirements:
    _permission: 'administer job application automation'

# Job Discovery - Company-Specific Discovery Page
job_hunter.company_job_discovery:
  path: '/jobhunter/job-discovery/company/{company}'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::companyJobDiscovery'
    _title: 'Job Discovery'
  requirements:
    _permission: 'administer job application automation'
    company: \d+

# Job Discovery - AJAX Search Endpoint
job_hunter.job_discovery_search:
  path: '/jobhunter/job-discovery/search'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::jobDiscoverySearch'
  requirements:
    _permission: 'administer job application automation'
  methods: [POST]
  options:
    _csrf_token: FALSE

# Job Discovery - Save Job Endpoint
job_hunter.save_job:
  path: '/jobhunter/job-discovery/save'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::saveJob'
  requirements:
    _permission: 'administer job application automation'
  methods: [POST]
  options:
    _csrf_token: FALSE

# Target Companies Management
job_hunter.manage_target_companies:
  path: '/jobhunter/target-companies'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\JobApplicationController::manageTargetCompanies'
    _title: 'Manage Target Companies'
  requirements:
    _permission: 'administer job application automation'

job_hunter.save_target_companies:
  path: '/jobhunter/target-companies/save'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\JobApplicationController::saveTargetCompanies'
  requirements:
    _permission: 'administer job application automation'
  methods: [POST]

# Bulk Company Import
job_hunter.bulk_import_companies:
  path: '/jobhunter/bulk-import-companies'
  defaults:
    _form: '\Drupal\job_hunter\Form\BulkCompanyImportForm'
    _title: 'Bulk Import Companies'
  requirements:
    _permission: 'administer job application automation'

# Companies Overview
job_hunter.companies_overview:
  path: '/jobhunter/companies'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\JobApplicationController::companiesOverview'
    _title: 'Companies Overview'
  requirements:
    _permission: 'administer job application automation'

# Application Management Routes
job_hunter.add:
  path: '/jobhunter/applications/add'
  defaults:
    _form: '\Drupal\job_hunter\Form\JobApplicationForm'
    _title: 'Add Job Application'
  requirements:
    _permission: 'administer job application automation'

job_hunter.edit:
  path: '/jobhunter/applications/{job_application}/edit'
  defaults:
    _form: '\Drupal\job_hunter\Form\JobApplicationForm'
    _title: 'Edit Job Application'
  requirements:
    _permission: 'administer job application automation'
    _entity_access: 'job_application.update'

job_hunter.view:
  path: '/jobhunter/applications/{job_application}'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\JobApplicationController::view'
    _title_callback: '\Drupal\job_hunter\Controller\JobApplicationController::getTitle'
  requirements:
    _permission: 'administer job application automation'
    _entity_access: 'job_application.view'

# Workflow Management Routes
job_hunter.workflow:
  path: '/jobhunter/applications/{job_application}/workflow'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\WorkflowController::manage'
    _title: 'Manage Application Workflow'
  requirements:
    _permission: 'administer job application automation'
    _entity_access: 'job_application.update'

job_hunter.bulk_actions:
  path: '/jobhunter/bulk-actions'
  defaults:
    _form: '\Drupal\job_hunter\Form\BulkActionsForm'
    _title: 'Bulk Actions'
  requirements:
    _permission: 'administer job application automation'

# User Profile Management Routes
job_hunter.user_profile_dashboard:
  path: '/jobhunter/profile/dashboard'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::dashboard'
    _title: 'Job Application Profile'
  requirements:
    _permission: 'administer job application automation'

job_hunter.user_profile_edit:
  path: '/jobhunter/profile/edit'
  defaults:
    _form: '\Drupal\job_hunter\Form\UserProfileForm'
    _title: 'Edit Job Application Profile'
  requirements:
    _permission: 'administer job application automation'

# Download Resume File
job_hunter.download_resume:
  path: '/jobhunter/resume/download/{file}'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::downloadResume'
  requirements:
    _user_is_logged_in: 'TRUE'
    file: \d+

# Delete Resume File
job_hunter.delete_resume:
  path: '/jobhunter/resume/delete/{resume_id}'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::deleteResume'
  requirements:
    _user_is_logged_in: 'TRUE'
    resume_id: \d+

# Current User Profile Shortcuts
job_hunter.my_profile:
  path: '/jobhunter/my-profile'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::myProfile'
    _title: 'My Job Application Profile'
  requirements:
    _permission: 'administer job application automation'

job_hunter.my_profile_edit:
  path: '/jobhunter/my-profile/edit'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::myProfileEdit'
    _title: 'Edit My Job Application Profile'
  requirements:
    _permission: 'administer job application automation'

# Tailor Resume for Specific Job
job_hunter.tailor_resume:
  path: '/jobhunter/tailor-resume/{job}'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::tailorResume'
    _title: 'Tailor Resume for Job'
  requirements:
    _user_is_logged_in: 'TRUE'
    job: \d+

# AJAX endpoint for resume tailoring
job_hunter.tailor_resume_ajax:
  path: '/jobhunter/tailor-resume/ajax'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::tailorResumeAjax'
  requirements:
    _permission: 'administer job application automation'
  methods: [POST]
  options:
    _csrf_token: FALSE

# AJAX endpoint for tailoring status check
job_hunter.tailor_resume_status_ajax:
  path: '/jobhunter/tailor-resume/status'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::tailorResumeStatusAjax'
  requirements:
    _permission: 'administer job application automation'
  methods: [GET]

# AJAX endpoint for adding skill to profile
job_hunter.add_skill_to_profile_ajax:
  path: '/jobhunter/profile/add-skill'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::addSkillToProfileAjax'
  requirements:
    _permission: 'administer job application automation'
  methods: [POST]
  options:
    _csrf_token: FALSE

# AJAX endpoint for refreshing skills gap analysis
job_hunter.refresh_skills_gap_ajax:
  path: '/jobhunter/tailor-resume/refresh-skills-gap'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\UserProfileController::refreshSkillsGapAjax'
  requirements:
    _permission: 'administer job application automation'
  methods: [POST]
  options:
    _csrf_token: FALSE

# Company Management Routes
job_hunter.companies_list:
  path: '/jobhunter/companies/list'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\CompanyController::listCompanies'
    _title: 'Companies'
  requirements:
    _permission: 'administer job application automation'

job_hunter.company_add:
  path: '/jobhunter/companies/add'
  defaults:
    _form: '\Drupal\job_hunter\Form\CompanyForm'
    _title: 'Add Company'
  requirements:
    _permission: 'administer job application automation'

job_hunter.company_edit:
  path: '/jobhunter/companies/{company_id}/edit'
  defaults:
    _form: '\Drupal\job_hunter\Form\CompanyForm'
    _title: 'Edit Company'
  requirements:
    _permission: 'administer job application automation'
    company_id: \d+

job_hunter.company_delete:
  path: '/jobhunter/companies/{company_id}/delete'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\CompanyController::deleteCompany'
  requirements:
    _permission: 'administer job application automation'
    company_id: \d+

# Job Requirement Management Routes
job_hunter.jobs_list:
  path: '/jobhunter/jobs'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\CompanyController::listJobs'
    _title: 'Job Postings'
  requirements:
    _user_is_logged_in: 'TRUE'

# Paste job posting (main entry point for job tailoring workflow)
job_hunter.job_paste:
  path: '/jobhunter/jobs/paste'
  defaults:
    _form: '\Drupal\job_hunter\Form\AddJobPostingForm'
    _title: 'Add Job Posting'
  requirements:
    _user_is_logged_in: 'TRUE'

# DEPRECATED: Old manual add routes removed - use job_hunter.job_paste instead
# job_hunter.job_add and job_hunter.job_add_for_company have been removed
# to ensure all job postings go through the AI-powered workflow

job_hunter.job_edit:
  path: '/jobhunter/jobs/{job_id}/edit'
  defaults:
    _form: '\Drupal\job_hunter\Form\JobRequirementForm'
    _title: 'Edit Job Requirement'
  requirements:
    _user_is_logged_in: 'TRUE'
    job_id: \d+

job_hunter.job_view:
  path: '/jobhunter/jobs/{job_id}'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\CompanyController::viewJob'
    _title: 'View Job'
  requirements:
    _user_is_logged_in: 'TRUE'
    job_id: \d+

job_hunter.job_delete:
  path: '/jobhunter/jobs/{job_id}/delete'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\CompanyController::deleteJob'
  requirements:
    _permission: 'administer job application automation'
    job_id: \d+

# Generate Tailored Resume PDF (AJAX)
job_hunter.generate_tailored_resume_pdf:
  path: '/jobhunter/jobs/{job_id}/resume/generate'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\ResumeController::generateTailoredPdf'
    _title: 'Generate Resume PDF'
  requirements:
    _user_is_logged_in: 'TRUE'
    job_id: \d+

# Download Tailored Resume as PDF
job_hunter.download_tailored_resume_pdf:
  path: '/jobhunter/jobs/{job_id}/resume/pdf'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\ResumeController::downloadTailoredPdf'
    _title: 'Download Resume PDF'
  requirements:
    _user_is_logged_in: 'TRUE'
    job_id: \d+

# Download specific PDF by history ID
job_hunter.download_pdf_by_id:
  path: '/jobhunter/resume/pdf/{pdf_id}'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\ResumeController::downloadPdfById'
    _title: 'Download Resume PDF'
  requirements:
    _user_is_logged_in: 'TRUE'
    pdf_id: \d+

# Delete specific PDF by history ID
job_hunter.delete_pdf:
  path: '/jobhunter/resume/pdf/{pdf_id}/delete'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\ResumeController::deletePdf'
    _title: 'Delete Resume PDF'
  methods: [POST, DELETE]
  requirements:
    _user_is_logged_in: 'TRUE'
    pdf_id: \d+

# Download Base Resume as PDF
job_hunter.download_base_resume_pdf:
  path: '/jobhunter/resume/pdf'
  defaults:
    _controller: '\Drupal\job_hunter\Controller\ResumeController::downloadBasePdf'
    _title: 'Download Resume PDF'
  requirements:
    _user_is_logged_in: 'TRUE'

