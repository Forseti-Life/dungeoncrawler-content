resume_tailoring.dashboard:
  path: '/resume-tailoring'
  defaults:
    _controller: '\Drupal\resume_tailoring\Controller\ResumeTailoringController::dashboard'
    _title: 'Resume Tailoring Dashboard'
  requirements:
    _user_is_logged_in: 'TRUE'
    _permission: 'access resume tailoring'

resume_tailoring.admin_dashboard:
  path: '/admin/resume-tailoring'
  defaults:
    _controller: '\Drupal\resume_tailoring\Controller\ResumeTailoringController::dashboard'
    _title: 'Resume Tailoring Administration'
  requirements:
    _permission: 'administer resume tailoring'

resume_tailoring.generate:
  path: '/resume-tailoring/generate/{job_posting_id}'
  defaults:
    _controller: '\Drupal\resume_tailoring\Controller\ResumeTailoringController::generateTailoredResume'
    _title: 'Generate Tailored Resume'
  requirements:
    _user_is_logged_in: 'TRUE'
    _permission: 'create tailored resumes'
    job_posting_id: \d+

resume_tailoring.settings:
  path: '/admin/config/content/resume-tailoring'
  defaults:
    _form: '\Drupal\resume_tailoring\Form\SettingsForm'
    _title: 'Resume Tailoring Settings'
  requirements:
    _permission: 'administer resume tailoring'