name: Merge issue branches into testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-issue-branches-into-testing
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare testing branch
        id: prepare_testing
        run: |
          set -eo pipefail

          git fetch origin +refs/heads/testing:refs/remotes/origin/testing

          if ! git show-ref --verify --quiet refs/remotes/origin/testing; then
            echo "::error::Remote branch origin/testing is missing after fetch."
            exit 1
          fi

          git switch -C testing origin/testing

          testing_sha=$(git rev-parse HEAD)
          echo "testing_sha=$testing_sha" >> "$GITHUB_OUTPUT"

          {
            echo "### Testing branch preflight"
            echo "- Remote branch fetched: \`origin/testing\`"
            echo "- Local testing branch reset to: \`$testing_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge copilot-assigned PR branches into testing
        id: merge_testing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          prs=$(gh pr list --state open --json number,title,headRefName,baseRefName,isDraft,mergeStateStatus \
            --jq '.[] | @base64')

          if [ -z "$prs" ]; then
            echo "No open PRs assigned to copilot."
            echo "merged=0" >> "$GITHUB_OUTPUT"
            echo "merged_count=0" >> "$GITHUB_OUTPUT"
            echo "testing_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            {
              echo "### Merge evaluation"
              echo "- Result: \`no-op\`"
              echo "- Eligible Copilot PRs merged: \`0\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          merged=0
          merged_count=0
          merged_prs=""
          decode() { echo "$1" | base64 --decode; }

          for pr in $prs; do
            data=$(decode "$pr")
            number=$(echo "$data" | jq -r '.number')
            title=$(echo "$data" | jq -r '.title')
            head=$(echo "$data" | jq -r '.headRefName')
            base=$(echo "$data" | jq -r '.baseRefName')
            merge_state=$(echo "$data" | jq -r '.mergeStateStatus')

            meta=$(gh pr view "$number" --json isDraft,reviewRequests,assignees,reviewDecision,statusCheckRollup --jq '{isDraft,reviewDecision,reviewRequests:[.reviewRequests[].login],assignees:[.assignees[].login],statusCheckRollup:.statusCheckRollup}')
            is_draft=$(echo "$meta" | jq -r '.isDraft')
            review_decision=$(echo "$meta" | jq -r '.reviewDecision // ""')
            copilot_requested=$(echo "$meta" | jq -r '.reviewRequests[]? | ascii_downcase' | grep -x "copilot" || true)
            copilot_assigned=$(echo "$meta" | jq -r '.assignees[]? | ascii_downcase' | grep -x "copilot" || true)
            failing_checks=$(echo "$meta" | jq -r '[.statusCheckRollup[]? | select((.conclusion // "") | ascii_downcase | test("failure|cancelled|timed_out|action_required|stale"))] | length')
            pending_checks=$(echo "$meta" | jq -r '[.statusCheckRollup[]? | select((.status // "") | ascii_downcase | test("queued|in_progress|pending"))] | length')

            if [ "$base" != "main" ]; then
              echo "Skipping PR #$number ($head -> $base): base is not main."
              continue
            fi

            if [ -z "$copilot_requested" ] && [ -z "$copilot_assigned" ]; then
              echo "Skipping PR #$number ($head -> $base): no Copilot review request or assignment."
              continue
            fi

            if [ "$is_draft" = "true" ]; then
              echo "Skipping draft PR #$number ($head -> $base): $title"
              continue
            fi

            if [ "$merge_state" != "CLEAN" ] && [ "$merge_state" != "HAS_HOOKS" ]; then
              echo "Skipping PR #$number ($head -> $base): mergeStateStatus=$merge_state"
              continue
            fi

            if [ "$review_decision" = "CHANGES_REQUESTED" ]; then
              echo "Skipping PR #$number ($head -> $base): review decision is CHANGES_REQUESTED"
              continue
            fi

            if [ "$failing_checks" -gt 0 ]; then
              echo "Skipping PR #$number ($head -> $base): failing checks detected ($failing_checks)"
              continue
            fi

            if [ "$pending_checks" -gt 0 ]; then
              echo "Skipping PR #$number ($head -> $base): pending checks detected ($pending_checks)"
              continue
            fi

            echo "Processing PR #$number ($head -> $base): $title"
            git fetch origin "$head"

            if git merge --no-ff "origin/$head" -m "Merge PR #$number into testing: $title"; then
              merged=1
              merged_count=$((merged_count + 1))
              merged_prs="${merged_prs}#${number} (${head})"$'\n'
              echo "Merged #$number from $head"
            else
              git merge --abort || true
              echo "::warning::Merge conflict for #$number ($head); skipped"
            fi
          done

          testing_sha=$(git rev-parse HEAD)
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          echo "merged_count=$merged_count" >> "$GITHUB_OUTPUT"
          echo "testing_sha=$testing_sha" >> "$GITHUB_OUTPUT"
          {
            echo "merged_prs<<EOF"
            printf '%s' "$merged_prs"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$merged" -eq 1 ]; then
            git push origin testing
            echo "Pushed updates to testing."
            result="pushed"
          else
            echo "No merges applied; testing unchanged."
            result="no-op"
          fi

          {
            echo "### Merge evaluation"
            echo "- Result: \`$result\`"
            echo "- Eligible Copilot PRs merged: \`$merged_count\`"
            echo "- testing HEAD after merge step: \`$testing_sha\`"
            if [ "$merged_count" -gt 0 ]; then
              echo "- Merged PRs:"
              printf '%s' "$merged_prs" | sed 's/^/  - /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify testing branch health
        run: |
          set -eo pipefail

          before_sha="${{ steps.prepare_testing.outputs.testing_sha }}"
          current_sha="${{ steps.merge_testing.outputs.testing_sha }}"
          merged="${{ steps.merge_testing.outputs.merged }}"
          merged_count="${{ steps.merge_testing.outputs.merged_count }}"

          if [ -z "$before_sha" ] || [ -z "$current_sha" ] || [ -z "$merged" ] || [ -z "$merged_count" ]; then
            echo "::error::Missing merge workflow outputs required for verification."
            exit 1
          fi

          git fetch origin +refs/heads/testing:refs/remotes/origin/testing
          remote_sha=$(git rev-parse refs/remotes/origin/testing)
          local_sha=$(git rev-parse HEAD)

          if [ "$local_sha" != "$current_sha" ]; then
            echo "::error::Local testing HEAD ($local_sha) does not match recorded merge result ($current_sha)."
            exit 1
          fi

          if [ "$merged" = "1" ]; then
            if [ "$remote_sha" != "$current_sha" ]; then
              echo "::error::Remote testing ref ($remote_sha) does not match pushed merge result ($current_sha)."
              exit 1
            fi

            {
              echo "### Merge health verification"
              echo "- Status: \`pass\`"
              echo "- Merge result: \`successful\`"
              echo "- Merged PR count: \`$merged_count\`"
              echo "- Verified pushed testing ref: \`$remote_sha\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$remote_sha" != "$before_sha" ]; then
              echo "::error::testing changed unexpectedly during a no-op run (before=$before_sha, after=$remote_sha)."
              exit 1
            fi

            {
              echo "### Merge health verification"
              echo "- Status: \`pass\`"
              echo "- Merge result: \`no-op\`"
              echo "- Verified testing remained unchanged at: \`$remote_sha\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
