name: Auto-ready PR on Copilot signal

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

concurrency: auto-ready-on-copilot-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}

env:
  READY_KEYWORD: ready-for-testing

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Set ready when Copilot signals
        env:
          READY_KEYWORD: ${{ env.READY_KEYWORD }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_HAS_PR: ${{ github.event.issue.pull_request.html_url || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login || '' }}
          REVIEW_BODY: ${{ github.event.review.body || '' }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login || '' }}
          PR_NUMBER_COMMENT: ${{ github.event.issue.number || '' }}
          PR_NUMBER_REVIEW: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          # Resolve PR number based on event type
          pr_number="$PR_NUMBER_COMMENT"
          if [ -z "$pr_number" ]; then
            pr_number="$PR_NUMBER_REVIEW"
          fi

          if [ -z "$pr_number" ]; then
            echo "No PR number found; skipping."
            exit 0
          fi

          if [ "$EVENT_NAME" = "issue_comment" ] && [ -z "$ISSUE_HAS_PR" ]; then
            echo "Comment is on an issue (not a PR); skipping."
            exit 0
          fi

          # Choose author/body by event kind
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            author="$COMMENT_AUTHOR"
            body="$COMMENT_BODY"
          else
            author="$REVIEW_AUTHOR"
            body="$REVIEW_BODY"
          fi

          author_lc=$(echo "${author:-}" | tr 'A-Z' 'a-z')
          body_lc=$(echo "${body:-}" | tr 'A-Z' 'a-z')
          keyword_lc=$(echo "$READY_KEYWORD" | tr 'A-Z' 'a-z')

          case "$author_lc" in
            copilot|copilot-swe-agent[bot]|github-copilot[bot]) ;;
            *)
              echo "Author is not a Copilot automation account; skipping."
              exit 0
              ;;
          esac

          if ! echo "$body_lc" | grep -Fq "$keyword_lc"; then
            echo "Keyword '$READY_KEYWORD' not present; skipping."
            exit 0
          fi

          # Fetch PR details
          meta=$(gh pr view "$pr_number" --json headRefName,isDraft --jq '{head:.headRefName,isDraft:.isDraft}')
          head_ref=$(echo "$meta" | jq -r '.head')
          is_draft=$(echo "$meta" | jq -r '.isDraft')

          case "$head_ref" in
            copilot/*) ;;
            *)
              echo "Head branch $head_ref not in copilot/*; skipping."
              exit 0
              ;;
          esac

          if [ "$is_draft" != "true" ]; then
            echo "PR #$pr_number already ready."
            exit 0
          fi

          echo "Marking PR #$pr_number ready (signal from Copilot, keyword '$READY_KEYWORD')."
          gh pr ready "$pr_number"
