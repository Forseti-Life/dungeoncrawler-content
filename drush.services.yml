services:
  dungeoncrawler_content.commands.quest_template:
    class: Drupal\dungeoncrawler_content\Commands\QuestTemplateCommands
    arguments:
      - '@database'
      - '@logger.factory'
    tags:
      - { name: drush.command }

  dungeoncrawler_content.commands.initial_game_content:
    class: Drupal\dungeoncrawler_content\Commands\InitialGameContentCommands
    arguments:
      - '@database'
      - '@logger.factory'
    tags:
      - { name: drush.command }

  dungeoncrawler_content.commands.content_seeder:
    class: Drupal\dungeoncrawler_content\Commands\ContentSeederCommands
    arguments:
      - '@dungeoncrawler_content.content_seeder'
      - '@dungeoncrawler_content.content_registry'
    tags:
      - { name: drush.command }

  dungeoncrawler_content.commands.requirements_import:
    class: Drupal\dungeoncrawler_content\Commands\RequirementsImportCommands
    arguments:
      - '@database'
    tags:
      - { name: drush.command }

  dungeoncrawler_content.commands.npc_sheet_worker:
    class: Drupal\dungeoncrawler_content\Commands\NpcSheetWorkerCommands
    arguments:
      - '@dungeoncrawler_content.npc_sheet_generation'
    tags:
      - { name: drush.command }

  dungeoncrawler_content.commands.storyline_expansion_worker:
    class: Drupal\dungeoncrawler_content\Commands\StorylineExpansionWorkerCommands
    arguments:
      - '@dungeoncrawler_content.storyline_generation_service'
    tags:
      - { name: drush.command }

  dungeoncrawler_content.commands.player_agent:
    class: Drupal\dungeoncrawler_content\Commands\PlayerAgentCommands
    arguments:
      - '@dungeoncrawler_content.player_agent_harness'
    tags:
      - { name: drush.command }

  dungeoncrawler_content.commands.gm_actor:
    class: Drupal\dungeoncrawler_content\Commands\GmActorCommands
    arguments:
      - '@dungeoncrawler_content.gm_actor_harness'
    tags:
      - { name: drush.command }

  dungeoncrawler_content.commands.institution_backfill:
    class: Drupal\dungeoncrawler_content\Commands\InstitutionBackfillCommands
    arguments:
      - '@dungeoncrawler_content.library_institution_backfill'
      - '@dungeoncrawler_content.campaign_institution_backfill'
    tags:
      - { name: drush.command }

  dungeoncrawler_content.commands.actor_harness_langgraph:
    class: Drupal\dungeoncrawler_content\Commands\ActorHarnessLangGraphCommands
    arguments:
      - '@dungeoncrawler_content.campaign_initialization'
      - '@dungeoncrawler_content.character_manager'
      - '@dungeoncrawler_content.campaign_character_runtime_resolver'
      - '@dungeoncrawler_content.quest_tracker'
      - '@dungeoncrawler_content.navigation_service'
      - '@dungeoncrawler_content.player_agent_runtime_adapter'
      - '@?dungeoncrawler_content.actor_process_flow_planner'
      - '@dungeoncrawler_content.runtime_bootstrap'
      - '@database'
      - '@current_user'
    tags:
      - { name: drush.command }

  dungeoncrawler_content.commands.runtime_identity_backfill:
    class: Drupal\dungeoncrawler_content\Commands\RuntimeIdentityBackfillCommands
    arguments:
      - '@database'
      - '@datetime.time'
    tags:
      - { name: drush.command }
