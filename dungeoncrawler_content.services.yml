# Service definitions for the Dungeon Crawler Content module.
#
# This file defines Drupal services for character management, game content,
# campaign state, combat system, and access control. Services follow Drupal's
# dependency injection patterns.
#
# @see https://www.drupal.org/docs/drupal-apis/services-and-dependency-injection
services:
  # Content Management Services
  dungeoncrawler_content.game_manager:
    class: Drupal\dungeoncrawler_content\Service\GameContentManager
    arguments: ['@entity_type.manager', '@database']

  dungeoncrawler_content.game_object_inventory:
    class: Drupal\dungeoncrawler_content\Service\GameObjectInventoryService
    arguments: ['@database']

  dungeoncrawler_content.template_importer:
    class: Drupal\dungeoncrawler_content\Service\TemplateImportService
    arguments:
      - '@database'
      - '@extension.list.module'
      - '@logger.factory'

  dungeoncrawler_content.character_manager:
    class: Drupal\dungeoncrawler_content\Service\CharacterManager
    arguments: ['@database', '@current_user', '@uuid', '@dungeoncrawler_content.inventory_management', '@dungeoncrawler_content.deity_catalog', '@dungeoncrawler_content.name_generator', '@dungeoncrawler_content.feat_library', '@dungeoncrawler_content.spell_catalog']

  dungeoncrawler_content.name_generator:
    class: Drupal\dungeoncrawler_content\Service\NameGeneratorService
    arguments: ['@extension.list.module']

  dungeoncrawler_content.campaign_name_generator:
    class: Drupal\dungeoncrawler_content\Service\CampaignNameGeneratorService
    arguments: ['@extension.list.module']

  dungeoncrawler_content.character_state:
    class: Drupal\dungeoncrawler_content\Service\CharacterStateService
    arguments: ['@database', '@current_user', '@dungeoncrawler_content.feat_effect_manager', '@dungeoncrawler_content.generated_image_repository', '@dungeoncrawler_content.number_generation', '@dungeoncrawler_content.impact_contract', '@dungeoncrawler_content.active_effect_store']

  dungeoncrawler_content.character_state_service:
    alias: dungeoncrawler_content.character_state

  dungeoncrawler_content.impact_contract:
    class: Drupal\dungeoncrawler_content\Service\ImpactContractService

  dungeoncrawler_content.active_effect_store:
    class: Drupal\dungeoncrawler_content\Service\ActiveEffectStoreService
    arguments: ['@database']

  dungeoncrawler_content.multiclass_archetype_service:
    class: Drupal\dungeoncrawler_content\Service\MulticlassArchetypeService

  dungeoncrawler_content.npc_service:
    class: Drupal\dungeoncrawler_content\Service\NpcService
    arguments:
      - '@database'
      - '@current_user'
      - '@dungeoncrawler_content.npc_sheet_generation'
      - '@dungeoncrawler_content.institution_membership'
      - '@dungeoncrawler_content.faction_generation'
      - '@dungeoncrawler_content.name_generator'

  dungeoncrawler_content.institution_normalization:
    class: Drupal\dungeoncrawler_content\Service\InstitutionNormalizationService

  dungeoncrawler_content.campaign_subject_registry:
    class: Drupal\dungeoncrawler_content\Service\CampaignSubjectRegistryService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.institution_normalization'
      - '@dungeoncrawler_content.relationship_manager'

  dungeoncrawler_content.institution_membership:
    class: Drupal\dungeoncrawler_content\Service\InstitutionMembershipService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.campaign_subject_registry'
      - '@dungeoncrawler_content.institution_normalization'
      - '@dungeoncrawler_content.relationship_manager'

  dungeoncrawler_content.faction_generation:
    class: Drupal\dungeoncrawler_content\Service\FactionGenerationService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.institution_normalization'
      - '@dungeoncrawler_content.campaign_subject_registry'

  dungeoncrawler_content.library_institution_backfill:
    class: Drupal\dungeoncrawler_content\Service\LibraryInstitutionBackfillService
    arguments:
      - '@database'
      - '@extension.list.module'
      - '@dungeoncrawler_content.institution_membership'

  dungeoncrawler_content.campaign_institution_backfill:
    class: Drupal\dungeoncrawler_content\Service\CampaignInstitutionBackfillService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.institution_membership'

  dungeoncrawler_content.institution_review_decision:
    class: Drupal\dungeoncrawler_content\Service\InstitutionReviewDecisionService
    arguments:
      - '@database'
      - '@datetime.time'

  dungeoncrawler_content.institution_review_application:
    class: Drupal\dungeoncrawler_content\Service\InstitutionReviewApplicationService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.institution_review_decision'
      - '@dungeoncrawler_content.campaign_institution_backfill'
      - '@dungeoncrawler_content.library_institution_backfill'
      - '@datetime.time'

  dungeoncrawler_content.npc_sheet_generation:
    class: Drupal\dungeoncrawler_content\Service\NpcSheetGenerationService
    arguments:
      - '@database'
      - '@logger.factory'
      - '@?ai_conversation.ai_api_service'
      - '@?dungeoncrawler_content.npc_psychology_service'
      - '@dungeoncrawler_content.state_validation_service'

  dungeoncrawler_content.character_leveling:
    class: Drupal\dungeoncrawler_content\Service\CharacterLevelingService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.multiclass_archetype_service'
      - '@dungeoncrawler_content.deity_catalog'
      - '@dungeoncrawler_content.character_progression_registry'
      - '@dungeoncrawler_content.feat_library'

  dungeoncrawler_content.character_progression_registry:
    class: Drupal\dungeoncrawler_content\Service\CharacterProgressionRegistry

  dungeoncrawler_content.inventory_management:
    class: Drupal\dungeoncrawler_content\Service\InventoryManagementService
    arguments:
      - '@database'
      - '@current_user'
      - '@dungeoncrawler_content.character_state'

  dungeoncrawler_content.treasure_by_level:
    class: Drupal\dungeoncrawler_content\Service\TreasureByLevelService

  dungeoncrawler_content.container_management:
    class: Drupal\dungeoncrawler_content\Service\ContainerManagementService
    arguments: ['@database']

  dungeoncrawler_content.canonical_action_registry:
    class: Drupal\dungeoncrawler_content\Service\CanonicalActionRegistryService
    arguments: ['@database', '@current_user']

  dungeoncrawler_content.gm_orchestration_broker:
    class: Drupal\dungeoncrawler_content\Service\GmOrchestrationBrokerService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.canonical_action_registry'
      - '@dungeoncrawler_content.quest_touchpoint'
      - '@service_container'

  dungeoncrawler_content.gm_tool_execution:
    class: Drupal\dungeoncrawler_content\Service\GmToolExecutionService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.game_coordinator'
      - '@current_user'
      - '@dungeoncrawler_content.h3_projection_queue'

  dungeoncrawler_content.gm_actor_chat_transport:
    class: Drupal\dungeoncrawler_content\Service\GmActorChatTransportService
    arguments:
      - '@dungeoncrawler_content.room_chat_service'

  dungeoncrawler_content.gm_actor_runtime:
    class: Drupal\dungeoncrawler_content\Service\GmActorRuntimeService
    arguments:
      - '@dungeoncrawler_content.game_coordinator'
      - '@dungeoncrawler_content.gm_actor_chat_transport'
      - '@dungeoncrawler_content.runtime_bootstrap'

  dungeoncrawler_content.gm_actor_harness:
    class: Drupal\dungeoncrawler_content\Service\GmActorHarnessService
    arguments:
      - '@dungeoncrawler_content.gm_actor_runtime'
      - '@dungeoncrawler_content.gm_tool_execution'

  dungeoncrawler_content.game_master_subsystem:
    class: Drupal\dungeoncrawler_content\Service\GameMasterSubsystemService
    arguments:
      - '@dungeoncrawler_content.game_coordinator'
      - '@dungeoncrawler_content.gm_actor_harness'

  dungeoncrawler_content.number_generation:
    class: Drupal\dungeoncrawler_content\Service\NumberGenerationService
    arguments: ['@database', '@current_user']

  dungeoncrawler_content.schema_loader:
    class: Drupal\dungeoncrawler_content\Service\SchemaLoader

  dungeoncrawler_content.map_visual_state_projector:
    class: Drupal\dungeoncrawler_content\Service\MapVisualStateProjector
    arguments:
      - '@dungeoncrawler_content.navigation_service'

  dungeoncrawler_content.runtime_graph_assembler:
    class: Drupal\dungeoncrawler_content\Service\RuntimeGraphAssemblerService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.graph_version_service'

  dungeoncrawler_content.dungeon_snapshot_refresher:
    class: Drupal\dungeoncrawler_content\Service\DungeonSnapshotRefresherService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.runtime_graph_assembler'

  dungeoncrawler_content.graph_version_service:
    class: Drupal\dungeoncrawler_content\Service\GraphVersionService
    arguments:
      - '@database'

  dungeoncrawler_content.h3_projection_ledger:
    class: Drupal\dungeoncrawler_content\Service\H3ProjectionLedgerService
    arguments:
      - '@database'

  dungeoncrawler_content.h3_projection_queue:
    class: Drupal\dungeoncrawler_content\Service\H3ProjectionQueueService
    arguments:
      - '@database'
      - '@queue'
      - '@lock'
      - '@dungeoncrawler_content.graph_version_service'
      - '@dungeoncrawler_content.h3_projection_ledger'
      - '@logger.factory'

  dungeoncrawler_content.starter_projection_artifact_registry:
    class: Drupal\dungeoncrawler_content\Service\StarterProjectionArtifactRegistryService
    arguments:
      - '@database'
      - '@logger.factory'

  dungeoncrawler_content.dungeon_payload_state_persistence:
    class: Drupal\dungeoncrawler_content\Service\DungeonPayloadStatePersistenceService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.runtime_graph_assembler'

  dungeoncrawler_content.campaign_runtime_state_store:
    class: Drupal\dungeoncrawler_content\Service\CampaignRuntimeStateStore
    arguments:
      - '@database'

  dungeoncrawler_content.campaign_runtime_mutation_service:
    class: Drupal\dungeoncrawler_content\Service\CampaignRuntimeMutationService
    arguments:
      - '@dungeoncrawler_content.campaign_runtime_state_store'
      - '@logger.factory'

  dungeoncrawler_content.actor_runtime_state_store:
    class: Drupal\dungeoncrawler_content\Service\ActorRuntimeStateStore
    arguments:
      - '@database'

  dungeoncrawler_content.actor_runtime_mutation_service:
    class: Drupal\dungeoncrawler_content\Service\ActorRuntimeMutationService
    arguments:
      - '@dungeoncrawler_content.actor_runtime_state_store'

  dungeoncrawler_content.room_runtime_state_store:
    class: Drupal\dungeoncrawler_content\Service\RoomRuntimeStateStore
    arguments:
      - '@database'

  dungeoncrawler_content.room_runtime_mutation_service:
    class: Drupal\dungeoncrawler_content\Service\RoomRuntimeMutationService
    arguments:
      - '@dungeoncrawler_content.room_runtime_state_store'

  dungeoncrawler_content.connection_runtime_state_store:
    class: Drupal\dungeoncrawler_content\Service\ConnectionRuntimeStateStore
    arguments:
      - '@database'

  dungeoncrawler_content.connection_runtime_mutation_service:
    class: Drupal\dungeoncrawler_content\Service\ConnectionRuntimeMutationService
    arguments:
      - '@dungeoncrawler_content.connection_runtime_state_store'

  dungeoncrawler_content.roadmap_pipeline_status_resolver:
    class: Drupal\dungeoncrawler_content\Service\RoadmapPipelineStatusResolver

  dungeoncrawler_content.ability_score_tracker:
    class: Drupal\dungeoncrawler_content\Service\AbilityScoreTracker
    arguments: ['@dungeoncrawler_content.character_manager']

  dungeoncrawler_content.character_creation_gm:
    class: Drupal\dungeoncrawler_content\Service\CharacterCreationGmService
    arguments:
      - '@database'
      - '@current_user'
      - '@datetime.time'
      - '@uuid'
      - '@dungeoncrawler_content.character_manager'
      - '@dungeoncrawler_content.ability_score_tracker'
      - '@dungeoncrawler_content.institution_membership'
      - '@dungeoncrawler_content.faction_generation'
      - '@?ai_conversation.ai_api_service'

  dungeoncrawler_content.character_wizard_hardening:
    class: Drupal\dungeoncrawler_content\Service\CharacterWizardHardeningService
    arguments:
      - '@dungeoncrawler_content.character_manager'
      - '@database'
      - '@dungeoncrawler_content.campaign_character_runtime_resolver'
      - '@datetime.time'
      - '@uuid'
      - '@current_user'

  dungeoncrawler_content.feat_effect_manager:
    class: Drupal\dungeoncrawler_content\Service\FeatEffectManager

  # Access Control Services
  dungeoncrawler_content.character_access_check:
    class: Drupal\dungeoncrawler_content\Access\CharacterAccessCheck
    arguments: ['@database']
    tags:
      - {name: access_check, applies_to: _character_access}

  dungeoncrawler_content.campaign_access_check:
    class: Drupal\dungeoncrawler_content\Access\CampaignAccessCheck
    arguments: ['@database']
    tags:
      - {name: access_check, applies_to: _campaign_access}

  dungeoncrawler_content.character_setup_access_check:
    class: Drupal\dungeoncrawler_content\Access\CharacterSetupAccessCheck
    arguments: ['@database', '@request_stack']
    tags:
      - {name: access_check, applies_to: _character_setup_access}

  dungeoncrawler_content.campaign_gm_access_check:
    class: Drupal\dungeoncrawler_content\Access\CampaignGmAccessCheck
    tags:
      - {name: access_check, applies_to: _campaign_gm_access}

  dungeoncrawler_content.campaign_quest_manage_access_check:
    class: Drupal\dungeoncrawler_content\Access\CampaignQuestManageAccessCheck
    arguments: ['@database']
    tags:
      - {name: access_check, applies_to: _campaign_quest_manage_access}

  # Game Content System Services
  dungeoncrawler_content.content_registry:
    class: Drupal\dungeoncrawler_content\Service\ContentRegistry
    arguments: ['@database', '@logger.factory', '@dungeoncrawler_content.state_validation_service']

  dungeoncrawler_content.content_query:
    class: Drupal\dungeoncrawler_content\Service\ContentQuery
    arguments: ['@database']

  dungeoncrawler_content.content_generator:
    class: Drupal\dungeoncrawler_content\Service\ContentGenerator
    # Legacy-only compatibility service. Do not use for new generation flows.
    # Prefer EncounterGeneratorService/RoomGeneratorService/DungeonGeneratorService.
    arguments: ['@dungeoncrawler_content.content_query', '@dungeoncrawler_content.number_generation']

  dungeoncrawler_content.gemini_image_generator:
    class: Drupal\dungeoncrawler_content\Service\GeminiImageGenerationService
    arguments: ['@logger.factory', '@datetime.time', '@config.factory', '@http_client']

  dungeoncrawler_content.vertex_image_generator:
    class: Drupal\dungeoncrawler_content\Service\VertexImageGenerationService
    arguments: ['@logger.factory', '@datetime.time', '@config.factory', '@database', '@http_client']

  dungeoncrawler_content.image_generation_integration:
    class: Drupal\dungeoncrawler_content\Service\ImageGenerationIntegrationService
    arguments: ['@config.factory', '@dungeoncrawler_content.gemini_image_generator', '@dungeoncrawler_content.vertex_image_generator']

  dungeoncrawler_content.text_to_speech_integration:
    class: Drupal\dungeoncrawler_content\Service\TextToSpeechIntegrationService
    arguments: ['@service_container', '@logger.factory']

  dungeoncrawler_content.room_view_image:
    class: Drupal\dungeoncrawler_content\Service\RoomViewImageService
    arguments: ['@database', '@logger.factory', '@dungeoncrawler_content.image_generation_integration', '@dungeoncrawler_content.chat_session_manager', '@dungeoncrawler_content.generated_image_repository', '@file_system']

  dungeoncrawler_content.generated_image_optimizer:
    class: Drupal\dungeoncrawler_content\Service\GeneratedImageOptimizationService

  dungeoncrawler_content.generated_image_repository:
    class: Drupal\dungeoncrawler_content\Service\GeneratedImageRepository
    arguments: ['@database', '@file_url_generator', '@file_system', '@uuid', '@datetime.time', '@logger.factory', '@dungeoncrawler_content.generated_image_optimizer']

  dungeoncrawler_content.character_image_prompt_builder:
    class: Drupal\dungeoncrawler_content\Service\CharacterImagePromptBuilder

  dungeoncrawler_content.character_portrait_generator:
    class: Drupal\dungeoncrawler_content\Service\CharacterPortraitGenerationService
    arguments:
      - '@dungeoncrawler_content.image_generation_integration'
      - '@dungeoncrawler_content.generated_image_repository'
      - '@dungeoncrawler_content.character_image_prompt_builder'
      - '@database'
      - '@logger.factory'

  dungeoncrawler_content.campaign_character_runtime_sync:
    class: Drupal\dungeoncrawler_content\Service\CampaignCharacterRuntimeSyncService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.follower_subsystem'
      - '@?dungeoncrawler_content.npc_sheet_generation'
      - '@?dungeoncrawler_content.character_portrait_generator'

  dungeoncrawler_content.campaign_character_runtime_resolver:
    class: Drupal\dungeoncrawler_content\Service\CampaignCharacterRuntimeResolverService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.character_manager'
      - '@dungeoncrawler_content.institution_membership'
      - '@dungeoncrawler_content.follower_subsystem'
      - '@datetime.time'

  dungeoncrawler_content.player_agent_runtime_adapter:
    class: Drupal\dungeoncrawler_content\Service\PlayerAgentRuntimeAdapter
    arguments:
      - '@dungeoncrawler_content.game_coordinator'
      - '@database'
      - '@dungeoncrawler_content.campaign_character_runtime_sync'
      - '@dungeoncrawler_content.runtime_bootstrap'

  dungeoncrawler_content.player_agent_exploration_policy:
    class: Drupal\dungeoncrawler_content\Service\PlayerAgentExplorationPolicy
    arguments:
      - '@?dungeoncrawler_content.quest_tracker'

  dungeoncrawler_content.player_agent_encounter_policy:
    class: Drupal\dungeoncrawler_content\Service\PlayerAgentEncounterPolicy

  dungeoncrawler_content.player_agent_progress_tracker:
    class: Drupal\dungeoncrawler_content\Service\PlayerAgentProgressTracker
    arguments:
      - '@dungeoncrawler_content.session_service'

  dungeoncrawler_content.player_agent_harness:
    class: Drupal\dungeoncrawler_content\Service\PlayerAgentHarnessService
    arguments:
      - '@dungeoncrawler_content.player_agent_runtime_adapter'
      - '@dungeoncrawler_content.player_agent_exploration_policy'
      - '@dungeoncrawler_content.player_agent_encounter_policy'
      - '@dungeoncrawler_content.player_agent_progress_tracker'
      - '@?dungeoncrawler_content.room_chat_service'

  dungeoncrawler_content.sprite_generator:
    class: Drupal\dungeoncrawler_content\Service\SpriteGenerationService
    arguments:
      - '@dungeoncrawler_content.image_generation_integration'
      - '@dungeoncrawler_content.generated_image_repository'
      - '@logger.factory'

  dungeoncrawler_content.campaign_content:
    class: Drupal\dungeoncrawler_content\Service\CampaignContentService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.content_registry'
      - '@logger.factory'

  # Combat System Services
  dungeoncrawler_content.combat_encounter_store:
    class: Drupal\dungeoncrawler_content\Service\CombatEncounterStore
    arguments: ['@database']

  dungeoncrawler_content.hp_manager:
    class: Drupal\dungeoncrawler_content\Service\HPManager
    arguments:
      - '@database'
      - '@dungeoncrawler_content.condition_manager'

  dungeoncrawler_content.condition_manager:
    class: Drupal\dungeoncrawler_content\Service\ConditionManager
    arguments: ['@database', '@dungeoncrawler_content.number_generation']

  dungeoncrawler_content.combat_calculator:
    class: Drupal\dungeoncrawler_content\Service\CombatCalculator

  dungeoncrawler_content.calculator:
    class: Drupal\dungeoncrawler_content\Service\Calculator
    arguments:
      - '@dungeoncrawler_content.number_generation'
      - '@dungeoncrawler_content.combat_calculator'

  dungeoncrawler_content.reaction_handler:
    class: Drupal\dungeoncrawler_content\Service\ReactionHandler
    arguments:
      - '@database'
      - '@dungeoncrawler_content.combat_calculator'
      - '@dungeoncrawler_content.hp_manager'
      - '@dungeoncrawler_content.combat_encounter_store'
      - '@dungeoncrawler_content.number_generation'
      - '@dungeoncrawler_content.condition_manager'

  dungeoncrawler_content.equipment_catalog:
    class: Drupal\dungeoncrawler_content\Service\EquipmentCatalogService

  dungeoncrawler_content.merchant_bot:
    class: Drupal\dungeoncrawler_content\Service\MerchantBotService
    arguments:
      - '@database'
      - '@logger.factory'
      - '@http_client'

  dungeoncrawler_content.merchant_transaction:
    class: Drupal\dungeoncrawler_content\Service\MerchantTransactionService
    arguments:
      - '@database'
      - '@dungeoncrawler_content.merchant_bot'
      - '@dungeoncrawler_content.inventory_management'

  dungeoncrawler_content.focus_pool:
    class: Drupal\dungeoncrawler_content\Service\FocusPoolService
    arguments:
      - '@database'

  dungeoncrawler_content.rules_engine:
    class: Drupal\dungeoncrawler_content\Service\RulesEngine
    arguments:
      - '@database'
      - '@dungeoncrawler_content.calculator'
      - '@dungeoncrawler_content.los_service'

  dungeoncrawler_content.combat_engine:
    class: Drupal\dungeoncrawler_content\Service\CombatEngine
    arguments:
      - '@database'
      - '@dungeoncrawler_content.combat_encounter_store'
      - '@dungeoncrawler_content.hp_manager'
      - '@dungeoncrawler_content.number_generation'
      - '@dungeoncrawler_content.combat_calculator'
      - '@dungeoncrawler_content.calculator'
      - '@dungeoncrawler_content.condition_manager'
      - '@dungeoncrawler_content.movement_resolver'
      - '@dungeoncrawler_content.affliction_manager'

  dungeoncrawler_content.encounter_ai_provider.stub:
    class: Drupal\dungeoncrawler_content\Service\StubEncounterAiProvider

  dungeoncrawler_content.encounter_ai_provider.ai_conversation:
    class: Drupal\dungeoncrawler_content\Service\AiConversationEncounterAiProvider
    arguments:
      - '@?ai_conversation.ai_api_service'
      - '@logger.factory'
      - '@config.factory'
      - '@dungeoncrawler_content.encounter_ai_provider.stub'
      - '@dungeoncrawler_content.ai_session_manager'
      - '@dungeoncrawler_content.actor_decision_contract'

  dungeoncrawler_content.encounter_ai_integration:
    class: Drupal\dungeoncrawler_content\Service\EncounterAiIntegrationService
    arguments:
      - '@dungeoncrawler_content.encounter_ai_provider.ai_conversation'
      - '@datetime.time'
      - '@logger.factory'
      - '@dungeoncrawler_content.actor_action_availability'
      - '@dungeoncrawler_content.actor_decision_contract'
      - '@dungeoncrawler_content.actor_decision_validator'

  dungeoncrawler_content.actor_action_availability:
    class: Drupal\dungeoncrawler_content\Service\ActorActionAvailabilityService

  dungeoncrawler_content.actor_decision_contract:
    class: Drupal\dungeoncrawler_content\Service\ActorDecisionContractService

  dungeoncrawler_content.actor_decision_validator:
    class: Drupal\dungeoncrawler_content\Service\ActorDecisionValidatorService

  dungeoncrawler_content.encounter_actor_context_builder:
    class: Drupal\dungeoncrawler_content\Service\EncounterActorContextBuilder
    arguments:
